<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Form</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
  <div class="container my-5">
    <h2 class="text-center mb-4">Your Order Summary</h2>

    <table class="table table-bordered">
      <thead class="table-dark">
        <tr>
          <th>#</th>
          <th>Item Name</th>
          <th>Price</th>
        </tr>
      </thead>
      <tbody id="cartTable"></tbody>
    </table>

    <h4 class="text-end me-3">Total: $<span id="totalPrice">0</span></h4>

    <hr>

    <h3 class="text-center my-4">Customer Details</h3>
    <form class="w-50 mx-auto">
      <input type="text" class="form-control mb-3" placeholder="Full Name" required>
      <input type="email" class="form-control mb-3" placeholder="Email" required>
      <input type="text" class="form-control mb-3" placeholder="Address" required>
      <button type="submit" class="btn btn-success w-100">Confirm Order</button>
    </form>
  </div>

</body>
</html>
